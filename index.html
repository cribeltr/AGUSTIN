<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="description" content="Gestión de mantención preventiva 2026 — HHHA" />
  <title>Gestión MP 2026 · HHHA</title>

  <!-- Fonts (intencionales, no Inter/Roboto por defecto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

  <!-- App CSS -->
  <link rel="stylesheet" href="src/css/tokens.css" />
  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="stylesheet" href="src/css/components.css" />
  <link rel="stylesheet" href="src/css/app.css" />

  <!-- Libs vía CDN -->
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- App entry -->
  <script type="module" src="src/js/main.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">MP</div>
        <div class="brand-name">Gestión MP 2026<small>HHHA</small></div>
      </div>
      <nav class="sidebar-nav" role="navigation">
        <button class="nav-item" data-route="hoy">
          <i data-lucide="sun"></i><span>Hoy</span>
          <span class="nav-badge is-zero" id="badge-hoy">0</span>
        </button>
        <button class="nav-item" data-route="equipos">
          <i data-lucide="hard-drive"></i><span>Equipos</span>
        </button>
        <button class="nav-item" data-route="pendientes">
          <i data-lucide="check-square"></i><span>Pendientes</span>
          <span class="nav-badge is-zero" id="badge-pendientes">0</span>
        </button>
        <button class="nav-item" data-route="verificacion">
          <i data-lucide="shield-check"></i><span>Verificación</span>
        </button>
        <button class="nav-item" data-route="agenda">
          <i data-lucide="users"></i><span>Agenda</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="sync-status" id="sync-status" title="Configurar sincronización">
          <span class="dot" id="sync-dot"></span>
          <span class="sync-label" id="sync-label">Sin sync</span>
          <i data-lucide="settings"></i>
        </button>
        <button class="nav-item" id="btn-sidebar-toggle" title="Colapsar barra lateral">
          <i data-lucide="chevrons-left"></i><span>Colapsar</span>
        </button>
      </div>
    </aside>

    <!-- Header -->
    <header class="header" role="banner">
      <button class="btn btn-icon btn-ghost btn-sm" id="btn-sidebar" aria-label="Menú" style="display:none">
        <i data-lucide="menu"></i>
      </button>
      <div class="header-title">
        <span id="header-title-text">Hoy</span>
      </div>
      <div class="header-actions">
        <input type="file" id="file-input" accept=".xlsm,.xlsx,.xls" hidden />
        <input type="file" id="import-json-input" accept=".json,application/json" hidden />
        <button class="btn" id="btn-upload" title="Cargar Programacion_MP_2026.xlsm">
          <i data-lucide="upload"></i><span class="nav-label-hidden-sm">Cargar archivo</span>
        </button>
        <div class="menu">
          <button class="btn btn-icon btn-ghost" id="btn-menu" aria-label="Más opciones" aria-haspopup="menu" aria-expanded="false">
            <i data-lucide="more-vertical"></i>
          </button>
          <div class="menu-pop hidden" id="header-menu-pop" role="menu">
            <button id="menu-user"><i data-lucide="user"></i> Mi usuario</button>
            <button id="menu-gas"><i data-lucide="cloud"></i> Sincronización…</button>
            <hr/>
            <button id="menu-export-xlsx"><i data-lucide="file-spreadsheet"></i> Exportar Excel</button>
            <button id="menu-export-json"><i data-lucide="download"></i> Exportar JSON</button>
            <button id="menu-import-json"><i data-lucide="upload"></i> Importar JSON</button>
            <hr/>
            <button id="menu-reset" style="color:var(--c-danger)"><i data-lucide="trash-2"></i> Borrar todos los datos</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="content" id="view-root" role="main">
      <div class="view">
        <div class="empty">
          <i data-lucide="loader-2"></i>
          <div class="empty-title">Cargando…</div>
        </div>
      </div>
    </main>
  </div>

  <noscript>
    <div style="padding:20px;text-align:center;font-family:sans-serif">
      Esta aplicación requiere JavaScript habilitado.
    </div>
  </noscript>
</body>
</html>
